name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifests parse
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool hooks/hooks.json > /dev/null
          python3 -m json.tool templates/claude-settings.json > /dev/null

      - name: Checks do what they claim
        run: python3 tools/run_tests.py

      - name: The repo obeys its own rules
        run: python3 tools/path_leak_check.py $(git ls-files)

      - name: Every rule id is unique
        run: python3 tools/check_rule_ids.py

      - name: The docs follow the prose rules
        run: python3 tools/prose_check.py --tracked

      - name: The hooks are wired to tools that exist
        run: |
          python3 - <<'EOF'
          import json, pathlib, re, sys
          wired = json.loads(pathlib.Path("hooks/hooks.json").read_text())
          missing = []
          for event in wired["hooks"].values():
              for matcher in event:
                  for entry in matcher["hooks"]:
                      for tool in re.findall(r"tools/([a-z_]+\.py)", entry["command"]):
                          if not pathlib.Path("tools", tool).is_file():
                              missing.append(tool)
          sys.exit("hooks reference missing tools: " + ", ".join(missing) if missing else 0)
          EOF
